name: CI-CD Pipeline

on:
  push:
    branches: [ main, master, dev ]
  pull_request:
    branches: [ main, master, dev ]

jobs:
  # ---------------------------
  # 1️⃣ BUILD STAGE
  # ---------------------------
  build:
    name: Build Application
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install Dependencies
        run: npm ci

      - name: Verify Build (sanity check)
        run: node -v && npm -v

  # ---------------------------
  # 2️⃣ LINT STAGE
  # ---------------------------
  lint:
    name: Lint Code
    runs-on: ubuntu-latest
    needs: build
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Run ESLint
        run: |
          npx eslint src --format stylish > lint_report.txt || true

      - name: Upload Lint Report
        uses: actions/upload-artifact@v4
        with:
          name: lint-report
          path: backend/lint_report.txt

  # ---------------------------
  # 3️⃣ TEST + COVERAGE STAGE
  # ---------------------------
  test:
    name: Run Tests with Coverage
    runs-on: ubuntu-latest
    needs: lint
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Run Tests with Coverage
        run: npm test -- --coverage

      - name: Enforce Coverage >= 75%
        run: |
          COVERAGE=$(node -pe "require('./coverage/coverage-summary.json').total.lines.pct")
          echo "Total coverage: $COVERAGE%"
          if (( $(echo "$COVERAGE < 75" | bc -l) )); then
            echo "❌ Coverage below 75% threshold"
            exit 1
          fi
          echo "✅ Coverage requirement met"

      - name: Upload Coverage Report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: backend/coverage

  # ---------------------------
  # 4️⃣ SECURITY SCAN STAGE
  # ---------------------------
  security:
    name: Security Analysis
    runs-on: ubuntu-latest
    needs: test
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Dependencies
        run: npm ci

      - name: Run npm Audit (JSON Output)
        run: npm audit --json > security_report.json || true

      - name: Fail if High/Critical Vulnerabilities
        run: |
          HIGH=$(jq '.metadata.vulnerabilities.high' security_report.json)
          CRITICAL=$(jq '.metadata.vulnerabilities.critical' security_report.json)
          echo "High: $HIGH, Critical: $CRITICAL"
          if [ "$HIGH" -gt 0 ] || [ "$CRITICAL" -gt 0 ]; then
            echo "❌ Security vulnerabilities detected!"
            exit 1
          fi
          echo "✅ No high/critical vulnerabilities found"

      - name: Upload Security Report
        uses: actions/upload-artifact@v4
        with:
          name: security-report
          path: backend/security_report.json

  # ---------------------------
  # 5️⃣ DEPLOYMENT ARTIFACT STAGE
  # ---------------------------
  package:
    name: Create Deployment Artifact
    runs-on: ubuntu-latest
    needs: [security]
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - name: Prepare Deployment Package
        run: |
          mkdir -p deployment-package
          cp -r src package.json package-lock.json README.md deployment-package/
          cp -r coverage lint_report.txt security_report.json deployment-package/ || true
          cd deployment-package
          zip -r ../deployment-package-${{ github.run_number }}.zip .

      - name: Upload Deployment Artifact
        uses: actions/upload-artifact@v4
        with:
          name: deployment-package-${{ github.run_number }}
          path: backend/deployment-package-${{ github.run_number }}.zip
