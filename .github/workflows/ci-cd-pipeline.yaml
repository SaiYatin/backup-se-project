name: CI-CD Pipeline

on:
  push:
    branches: [ main, master, dev ]
  pull_request:
    branches: [ main, master, dev ]

jobs:
  # ---------------------------
  # 1️⃣ BUILD STAGE
  # ---------------------------
  build:
    name: Build Application
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install Dependencies
        run: npm ci

      - name: Verify Build (sanity check)
        run: node -v && npm -v

      - name: Generate Build Report
        run: |
          echo "Build Report" > build_report.txt
          echo "=============" >> build_report.txt
          echo "Status: SUCCESS" >> build_report.txt
          echo "Node Version: $(node -v)" >> build_report.txt
          echo "NPM Version: $(npm -v)" >> build_report.txt
          echo "Build Date: $(date)" >> build_report.txt

      - name: Upload Build Report
        uses: actions/upload-artifact@v4
        with:
          name: build-report
          path: backend/build_report.txt

  # ---------------------------
  # 2️⃣ LINT STAGE
  # ---------------------------
  lint:
    name: Lint Code
    runs-on: ubuntu-latest
    needs: build
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Run ESLint
        run: |
          npx eslint src --format stylish > lint_report.txt || true

      - name: Upload Lint Report
        uses: actions/upload-artifact@v4
        with:
          name: lint-report
          path: backend/lint_report.txt

  # ---------------------------
  # 3️⃣ TEST + COVERAGE STAGE (UNIT TESTS)
  # ---------------------------
  test-unit:
    name: Run Unit Tests
    runs-on: ubuntu-latest
    needs: lint
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Run Unit Tests
        env:
          NODE_ENV: test
        run: npm run test:unit

      - name: Upload Unit Test Coverage
        uses: actions/upload-artifact@v4
        with:
          name: unit-coverage-report
          path: backend/coverage

  # ---------------------------
  # 3B️⃣ TEST + COVERAGE STAGE (INTEGRATION TESTS)
  # ---------------------------
  test-integration:
    name: Run Integration Tests
    runs-on: ubuntu-latest
    needs: lint
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Run Integration Tests
        env:
          NODE_ENV: test
        run: npm run test:integration

      - name: Upload Integration Test Coverage
        uses: actions/upload-artifact@v4
        with:
          name: integration-coverage-report
          path: backend/coverage

  # ---------------------------
  # 3C️⃣ TEST + COVERAGE STAGE (SYSTEM TESTS)
  # ---------------------------
  test-system:
    name: Run System Tests
    runs-on: ubuntu-latest
    needs: lint
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Run System Tests
        env:
          NODE_ENV: test
        run: npm run test:system

      - name: Upload System Test Coverage
        uses: actions/upload-artifact@v4
        with:
          name: system-coverage-report
          path: backend/coverage

  # ---------------------------
  # 3D️⃣ COVERAGE VALIDATION
  # ---------------------------
  test-coverage:
    name: Validate Coverage Threshold
    runs-on: ubuntu-latest
    needs: [test-unit, test-integration, test-system]
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Run All Tests with Coverage
        env:
          NODE_ENV: test
        run: npm test

      - name: Enforce Coverage >= 75% and Generate Report
        run: |
          COVERAGE=$(node -pe "require('./coverage/coverage-summary.json').total.lines.pct")
          echo "📊 Total Code Coverage: $COVERAGE%"
          
          # Generate simple coverage report
          echo "Coverage Report" > coverage_report.txt
          echo "===============" >> coverage_report.txt
          echo "Lines Coverage: ${COVERAGE}%" >> coverage_report.txt
          echo "Threshold: 75%" >> coverage_report.txt
          
          # Check if coverage meets threshold
          if (( $(echo "$COVERAGE < 75" | bc -l) )); then
            echo "Status: FAIL" >> coverage_report.txt
            echo "❌ Coverage below 75% threshold"
            exit 1
          else
            echo "Status: PASS" >> coverage_report.txt
            echo "✅ Coverage requirement met (>= 75%)"
          fi

      - name: Upload Coverage Report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: backend/coverage_report.txt

      - name: Upload Final Coverage Report
        uses: actions/upload-artifact@v4
        with:
          name: final-coverage-report
          path: backend/coverage

  # ---------------------------
  # 4️⃣ SECURITY SCAN STAGE
  # ---------------------------
  security:
    name: Security Analysis
    runs-on: ubuntu-latest
    needs: test-coverage
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Dependencies
        run: npm ci

      - name: Run npm Audit (JSON Output)
        run: npm audit --json > security_report.json || true

      - name: Fail if High/Critical Vulnerabilities
        run: |
          HIGH=$(jq '.metadata.vulnerabilities.high' security_report.json)
          CRITICAL=$(jq '.metadata.vulnerabilities.critical' security_report.json)
          echo "High: $HIGH, Critical: $CRITICAL"
          if [ "$HIGH" -gt 0 ] || [ "$CRITICAL" -gt 0 ]; then
            echo "❌ Security vulnerabilities detected!"
            exit 1
          fi
          echo "✅ No high/critical vulnerabilities found"

      - name: Upload Security Report
        uses: actions/upload-artifact@v4
        with:
          name: security-report
          path: backend/security_report.json

  # ---------------------------
  # 5️⃣ DEPLOYMENT ARTIFACT STAGE
  # ---------------------------
  package:
    name: Create Deployment Artifact
    runs-on: ubuntu-latest
    needs: [security]
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - name: Download Build Report
        uses: actions/download-artifact@v4
        with:
          name: build-report
          path: backend/

      - name: Download Lint Report
        uses: actions/download-artifact@v4
        with:
          name: lint-report
          path: backend/

      - name: Download Coverage Report
        uses: actions/download-artifact@v4
        with:
          name: coverage-report
          path: backend/

      - name: Download Security Report
        uses: actions/download-artifact@v4
        with:
          name: security-report
          path: backend/

      - name: Prepare Deployment Package
        run: |
          mkdir -p deployment-package
          cp -r src package.json package-lock.json README.md deployment-package/
          cp build_report.txt lint_report.txt coverage_report.txt security_report.json deployment-package/ || true
          cd deployment-package
          zip -r ../deployment-package-${{ github.run_number }}.zip .

      - name: Upload Deployment Artifact
        uses: actions/upload-artifact@v4
        with:
          name: deployment-package-${{ github.run_number }}
          path: backend/deployment-package-${{ github.run_number }}.zip
