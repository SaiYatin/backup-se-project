name: CI-CD Pipeline

on:
  push:
    branches: [ main, master, dev ]
  pull_request:
    branches: [ main, master, dev ]

jobs:
  # ---------------------------
  # 1️⃣ BUILD STAGE
  # ---------------------------
  build:
    name: Build Application
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install Dependencies
        run: npm ci

      - name: Verify Build (sanity check)
        run: node -v && npm -v

      - name: Generate Build Report
        run: |
          echo "Build Report" > build_report.txt
          echo "=============" >> build_report.txt
          echo "Status: SUCCESS" >> build_report.txt
          echo "Node Version: $(node -v)" >> build_report.txt
          echo "NPM Version: $(npm -v)" >> build_report.txt
          echo "Build Date: $(date)" >> build_report.txt

      - name: Upload Build Report
        uses: actions/upload-artifact@v4
        with:
          name: build-report
          path: backend/build_report.txt

  # ---------------------------
  # 2️⃣ LINT STAGE
  # ---------------------------
  lint:
    name: Lint Code
    runs-on: ubuntu-latest
    needs: build
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Run ESLint
        run: |
          npx eslint src --format stylish > lint_report.txt || true

      - name: Upload Lint Report
        uses: actions/upload-artifact@v4
        with:
          name: lint-report
          path: backend/lint_report.txt

  # ---------------------------
  # 3️⃣ ALL TESTS + COVERAGE (COMBINED)
  # ---------------------------
  test-all:
    name: Run All Tests with Coverage
    runs-on: ubuntu-latest
    needs: lint
    
    # PostgreSQL service container for integration/system tests
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install Dependencies
        run: npm ci

      - name: Wait for PostgreSQL
        run: |
          until pg_isready -h localhost -p 5432 -U test_user; do
            echo "Waiting for postgres..."
            sleep 2
          done

      - name: Run All Tests (Unit + Integration + System)
        env:
          NODE_ENV: test
          # Use local test database for GitHub Actions
          DATABASE_URL: postgresql://test_user:test_password@localhost:5432/test_db
          JWT_SECRET: test_jwt_secret_for_ci_cd_pipeline_testing
          JWT_EXPIRE: 7d
          FRONTEND_URL: http://localhost:5173
        run: npm test

      - name: Check Coverage Threshold
        run: |
          if [ ! -f coverage/coverage-summary.json ]; then
            echo "❌ Coverage summary not found!"
            exit 1
          fi
          
          LINES_PCT=$(node -pe "require('./coverage/coverage-summary.json').total.lines.pct")
          STATEMENTS_PCT=$(node -pe "require('./coverage/coverage-summary.json').total.statements.pct")
          
          echo "📊 Coverage Results:"
          echo "  Lines: ${LINES_PCT}%"
          echo "  Statements: ${STATEMENTS_PCT}%"
          echo ""
          
          # Generate coverage report
          echo "Coverage Report" > coverage_report.txt
          echo "===============" >> coverage_report.txt
          echo "Lines Coverage: ${LINES_PCT}%" >> coverage_report.txt
          echo "Statements Coverage: ${STATEMENTS_PCT}%" >> coverage_report.txt
          echo "Threshold: 75%" >> coverage_report.txt
          echo "" >> coverage_report.txt
          
          # Check thresholds (using bc for floating point comparison)
          LINES_FAIL=$(echo "$LINES_PCT < 75" | bc -l)
          STATEMENTS_FAIL=$(echo "$STATEMENTS_PCT < 75" | bc -l)
          
          if [ "$LINES_FAIL" -eq 1 ] || [ "$STATEMENTS_FAIL" -eq 1 ]; then
            echo "Status: FAIL" >> coverage_report.txt
            echo "❌ Coverage below 75% threshold"
            echo "  Lines: ${LINES_PCT}% (need >= 75%)"
            echo "  Statements: ${STATEMENTS_PCT}% (need >= 75%)"
            exit 1
          else
            echo "Status: PASS" >> coverage_report.txt
            echo "✅ Coverage requirement met (>= 75%)"
            echo "  Lines: ${LINES_PCT}%"
            echo "  Statements: ${STATEMENTS_PCT}%"
          fi

      - name: Upload Coverage Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: backend/coverage_report.txt

      - name: Upload Full Coverage Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: full-coverage-report
          path: backend/coverage

  # ---------------------------
  # 4️⃣ SECURITY SCAN STAGE
  # ---------------------------
  security:
    name: Security Analysis
    runs-on: ubuntu-latest
    needs: test-all
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Dependencies
        run: npm ci

      - name: Run npm Audit (JSON Output)
        run: npm audit --json > security_report.json || true

      - name: Fail if High/Critical Vulnerabilities
        run: |
          HIGH=$(jq '.metadata.vulnerabilities.high' security_report.json)
          CRITICAL=$(jq '.metadata.vulnerabilities.critical' security_report.json)
          echo "High: $HIGH, Critical: $CRITICAL"
          if [ "$HIGH" -gt 0 ] || [ "$CRITICAL" -gt 0 ]; then
            echo "❌ Security vulnerabilities detected!"
            exit 1
          fi
          echo "✅ No high/critical vulnerabilities found"

      - name: Upload Security Report
        uses: actions/upload-artifact@v4
        with:
          name: security-report
          path: backend/security_report.json

  # ---------------------------
  # 5️⃣ DEPLOYMENT ARTIFACT STAGE
  # ---------------------------
  package:
    name: Create Deployment Artifact
    runs-on: ubuntu-latest
    needs: [security]
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - name: Download Build Report
        uses: actions/download-artifact@v4
        with:
          name: build-report
          path: backend/

      - name: Download Lint Report
        uses: actions/download-artifact@v4
        with:
          name: lint-report
          path: backend/

      - name: Download Coverage Report
        uses: actions/download-artifact@v4
        with:
          name: coverage-report
          path: backend/

      - name: Download Security Report
        uses: actions/download-artifact@v4
        with:
          name: security-report
          path: backend/

      - name: Prepare Deployment Package
        run: |
          mkdir -p deployment-package
          cp -r src package.json package-lock.json README.md deployment-package/
          cp build_report.txt lint_report.txt coverage_report.txt security_report.json deployment-package/ || true
          cd deployment-package
          zip -r ../deployment-package-${{ github.run_number }}.zip .

      - name: Upload Deployment Artifact
        uses: actions/upload-artifact@v4
        with:
          name: deployment-package-${{ github.run_number }}
          path: backend/deployment-package-${{ github.run_number }}.zip