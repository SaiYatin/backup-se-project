# ========================================
# CI/CD Pipeline - Soul Society (P49)
# ========================================
# 6 Stages: Build → Test → Coverage → Lint → Security → Deploy
# Runs on: Push to main/develop/feature branches + PRs

name: CI/CD Pipeline

on:
  push:
    branches: [ main, develop, 'feature/**' ]
  pull_request:
    branches: [ main, develop ]

jobs:
  pipeline:
    runs-on: ubuntu-latest
    
    steps:
      # =====================================
      # STAGE 1: BUILD
      # =====================================
      - name: 📥 Checkout Code
        uses: actions/checkout@v4
      
      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'npm'
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json
      
      - name: 📦 Install Backend Dependencies
        working-directory: ./backend
        run: npm ci
      
      - name: 📦 Install Frontend Dependencies
        working-directory: ./frontend
        run: npm ci
      
      # =====================================
      # STAGE 2: TEST
      # =====================================
      - name: 🧪 Run Tests
        working-directory: ./backend
        run: npm test || true
      
      # =====================================
      # STAGE 3: COVERAGE
      # =====================================
      - name: 📊 Generate Coverage Report
        working-directory: ./backend
        run: npm test -- --coverage || true
      
      - name: 💾 Upload Coverage Report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: backend/coverage/
          retention-days: 30
      
      # =====================================
      # STAGE 4: LINT
      # =====================================
      - name: 🔍 Lint Backend
        working-directory: ./backend
        run: |
          npm install --save-dev eslint || true
          npx eslint src/ --max-warnings=20 || true
      
      - name: 🔍 Lint Frontend
        working-directory: ./frontend
        run: npm run lint || true
      
      # =====================================
      # STAGE 5: SECURITY
      # =====================================
      - name: 🛡️ Security Audit
        run: |
          cd backend && npm audit --audit-level=moderate || true
          cd ../frontend && npm audit --audit-level=moderate || true
      
      # =====================================
      # STAGE 6: DEPLOY (Create Artifact)
      # =====================================
      - name: 📦 Create Deployment Package
        run: |
          mkdir -p deploy
          
          # Copy backend
          cp -r backend/src deploy/backend-src
          cp backend/package.json deploy/
          
          # Copy frontend
          cp -r frontend/src deploy/frontend-src
          
          # Copy reports
          cp -r backend/coverage deploy/coverage-report || true
          
          # Create build info
          echo "Build: #${{ github.run_number }}" > deploy/BUILD_INFO.txt
          echo "Date: $(date)" >> deploy/BUILD_INFO.txt
          echo "Branch: ${{ github.ref_name }}" >> deploy/BUILD_INFO.txt
          
          # Create ZIP
          cd deploy && zip -r ../deployment-package.zip . && cd ..
      
      - name: 📤 Upload Deployment Artifact
        uses: actions/upload-artifact@v4
        with:
          name: deployment-package
          path: deployment-package.zip
          retention-days: 90
      
      # =====================================
      # SUMMARY
      # =====================================
      - name: ✅ Pipeline Complete
        run: |
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "✅ CI/CD Pipeline Completed!"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "Build #${{ github.run_number }}"
          echo "Branch: ${{ github.ref_name }}"
          echo ""
          echo "📦 Artifacts created:"
          echo "  • Coverage Report (HTML)"
          echo "  • Deployment Package (ZIP)"
          echo ""
          echo "Download artifacts from Actions tab!"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
